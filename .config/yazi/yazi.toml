"$schema" = "https://yazi-rs.github.io/schemas/yazi.json"

[mgr]
linemode = "size"

[preview]
max_width = 1920
max_height = 1080

[plugin]
prepend_previewers = [{ name = "*.md", run = "glow" }]
prepend_fetchers = [
{ name = "*", id = "git", run = "git" },
{id   = "mime", url  = "local://*" ,run  = "mime-ext.local", prio = "high"},
{id   = "mime", url  = "remote://*",  run  = "mime-ext.remote" ,prio = "high"}
]
