# Core video/HDR settings
vo=gpu-next
gpu-api=vulkan
gpu-context=waylandvk
hwdec=vulkan
hwdec-codecs=all

profile=gpu-hq
target-peak=400           # Further lowered
tone-mapping=bt.2390 
tone-mapping-param=0.65   # More aggressive contrast preservation
gamut-mapping-mode=perceptual  # Changed from clip to reduce saturation
saturation=0.8           # Added to reduce oversaturation
target-prim=bt.2020
target-trc=pq
hdr-compute-peak=yes
target-colorspace-hint=yes

scale=ewa_lanczossharp
cscale=ewa_lanczossharp
video-sync=display-resample
interpolation=yes
tscale=oversample
vd-lavc-dr=yes
vd-lavc-threads=16
vd-lavc-fast
vd-lavc-skiploopfilter=all

ao=pipewire
audio-channels=auto
# af=format=channels=7.1

sub-auto=fuzzy
sub-font-size=40
sub-color="#FFFFFFFF"
sub-border-color="#FF000000"
sub-border-size=3
osd-scale=1.5

cache=yes
cache-on-disk=yes
demuxer-max-bytes=2000M
demuxer-max-back-bytes=500M

keep-open=yes
save-position-on-quit=yes
