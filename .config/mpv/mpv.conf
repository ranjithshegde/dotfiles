# Core video/HDR settings
vo=gpu-next
gpu-api=vulkan
gpu-context=waylandvk
hwdec=vulkan
hwdec-codecs=all

profile=gpu-hq
vulkan-async-compute=yes
swapchain-depth=2

# HDR & Tone-mapping (Kept your custom contrast/saturation fixes)
target-peak=400        
tone-mapping=bt.2390 
tone-mapping-param=0.65   
gamut-mapping-mode=perceptual  
saturation=0.8           
target-prim=bt.2020
target-trc=pq
hdr-compute-peak=yes
target-colorspace-hint=yes

# Scaling & Interpolation
scale=ewa_lanczossharp
cscale=ewa_lanczossharp
video-sync=display-resample
interpolation=yes
tscale=oversample
vd-lavc-dr=yes
vd-lavc-fast

# Audio
ao=pipewire
audio-channels=auto

# Subtitles & OSD
sub-auto=fuzzy
sub-font-size=40
sub-color="#FFFFFFFF"
sub-border-color="#FF000000"
sub-border-size=3
osd-scale=1.5

# Memory-Safe Cache (No Disk Thrashing)
cache=yes
cache-on-disk=no
demuxer-max-bytes=1000M
demuxer-max-back-bytes=200M

keep-open=yes
save-position-on-quit=yes
